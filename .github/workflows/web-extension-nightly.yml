name: Web Extension Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-extension-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20.11.0
      - run: corepack yarn@3.7.0 install --immutable
      - run: corepack yarn@3.7.0 build
      - run: echo '91b5312d7cf150cd852d005b1e5d5f3d8ed2ed7cd8a481dfa1d561d48f7b3f27  dist/h5player.user.js' | sha256sum --check
      - run: test "$(wc -c < dist/h5player.user.js)" -eq 561788
      - run: git diff --exit-code -- dist/h5player.user.js

  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web-extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web-extension
      - run: corepack pnpm@11.21.0 check
      - run: corepack pnpm@11.21.0 test:coverage
      - run: corepack pnpm@11.21.0 build:all
      - run: corepack pnpm@11.21.0 test:budget
      - run: corepack pnpm@11.21.0 test:security
      - run: corepack pnpm@11.21.0 audit --audit-level high
      - run: corepack pnpm@11.21.0 exec web-ext lint --source-dir .output/firefox-mv3

  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web-extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web-extension
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-chromium
      - run: corepack pnpm@11.21.0 exec playwright install --with-deps chromium
      - run: corepack pnpm@11.21.0 test:e2e

  firefox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web-extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web-extension
      - run: corepack pnpm@11.21.0 test:e2e:firefox

  churn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web-extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web-extension
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-chromium
      - run: corepack pnpm@11.21.0 exec playwright install --with-deps chromium
      - run: corepack pnpm@11.21.0 build:chrome
      - run: corepack pnpm@11.21.0 test:churn

  release-evidence:
    needs: [legacy-baseline, static-gates, chromium-e2e, firefox-e2e, churn]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web-extension
      - name: Resolve reproducible source date
        id: source-date
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build twice and compare release evidence
        run: >-
          corepack pnpm@11.21.0 release:reproducibility --
          --channel beta
          --sequence 0
          --source-date-epoch "${{ steps.source-date.outputs.epoch }}"
          --output .release/nightly
          --gate format-lint-typecheck=passed
          --gate unit-component-integration=passed
          --gate coverage=passed
          --gate compatibility-fixtures=passed
          --gate security-boundaries=passed
          --gate bundle-budget=passed
          --gate chromium-e2e=passed
          --gate firefox-e2e=passed
          --gate churn-30m=passed
          --gate legacy-baseline=passed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-extension-nightly-release-evidence
          path: web-extension/.release/nightly
          if-no-files-found: error
          retention-days: 14
