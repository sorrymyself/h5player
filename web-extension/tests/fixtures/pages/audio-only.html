<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>H5Player fixture: audio only</title>
    <style>
      body {
        margin: 0;
        min-height: 900px;
        padding: 24px;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .note {
        max-width: 560px;
        padding: 16px;
        border: 1px solid #ccd6de;
        border-radius: 12px;
      }
      audio {
        width: 420px;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Audio-only fixture</h1>
    <div class="note">
      <p>The extension should use compact page feedback and never mount a video control panel.</p>
      <audio id="audio" controls></audio>
    </div>
  </body>
</html>
