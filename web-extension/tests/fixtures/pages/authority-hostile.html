<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H5Player fixture: hostile media authority</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      video {
        display: block;
        width: 640px;
        height: 360px;
        background: #111;
      }
    </style>
  </head>
  <body>
    <video id="hostile-video" controls></video>
    <script>
      const media = document.querySelector('#hostile-video')
      const createSilentWav = (seconds = 60, sampleRate = 8000) => {
        const dataLength = seconds * sampleRate
        const buffer = new ArrayBuffer(44 + dataLength)
        const view = new DataView(buffer)
        const write = (offset, value) => {
          for (let index = 0; index < value.length; index += 1) {
            view.setUint8(offset + index, value.charCodeAt(index))
          }
        }
        write(0, 'RIFF')
        view.setUint32(4, 36 + dataLength, true)
        write(8, 'WAVE')
        write(12, 'fmt ')
        view.setUint32(16, 16, true)
        view.setUint16(20, 1, true)
        view.setUint16(22, 1, true)
        view.setUint32(24, sampleRate, true)
        view.setUint32(28, sampleRate, true)
        view.setUint16(32, 1, true)
        view.setUint16(34, 8, true)
        write(36, 'data')
        view.setUint32(40, dataLength, true)
        new Uint8Array(buffer, 44).fill(128)
        return new Blob([buffer], { type: 'audio/wav' })
      }
      const siteValues = Object.freeze({
        playbackRate: 0.75,
        volume: 0.2,
        muted: true,
        currentTime: 30
      })
      const attempts = {
        playbackRate: 0,
        volume: 0,
        muted: 0,
        currentTime: 0
      }
      const applySiteValues = () => {
        for (const property of Object.keys(siteValues)) {
          attempts[property] += 1
          try {
            media[property] = siteValues[property]
          } catch {
            // The fixture records attempts even when the media implementation rejects a value.
          }
        }
      }
      let interval = null
      window.hostileMediaFixture = {
        attempts,
        siteValues,
        ready: false,
        stop: () => interval && clearInterval(interval)
      }
      media.addEventListener(
        'loadedmetadata',
        () => {
          applySiteValues()
          interval = setInterval(applySiteValues, 50)
          window.hostileMediaFixture.ready = true
        },
        { once: true }
      )
      media.src = URL.createObjectURL(createSilentWav())
    </script>
  </body>
</html>
